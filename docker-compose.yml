services:
  db:
    image: postgres:16-alpine
    container_name: zenda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenda
      POSTGRES_PASSWORD: zenda_dev_password
      POSTGRES_DB: zenda
    ports:
      - "5432:5432"
    volumes:
      - zenda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenda -d zenda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zenda_pgdata: